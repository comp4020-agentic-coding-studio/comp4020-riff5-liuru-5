<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>泡 · a bubble game</title>
    <meta
      name="description"
      content="Click the bubble before it's gone. Miss once and the round ends — how many can you catch?"
    />

    <!--
      The link-preview card: public/card.png, 1200x630 --- replace it. The URL
      resolves against this page, like any link. No og:title/og:description:
      scrapers fall back to the <title> and description above.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:image" content="./card.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header>
      <nav aria-label="Primary">
        <a href="./">Home</a>
      </nav>
    </header>
    <main>
      <h1>泡</h1>
      <div id="stage">
        <div class="atmosphere" aria-hidden="true">
          <div class="rays"></div>
          <div class="bg-bubbles"></div>
        </div>
        <div id="score"></div>
        <div id="lives"></div>
        <div id="best"></div>
        <div id="intro">Pop bubbles &mdash; don&rsquo;t miss</div>
        <div id="milestone" aria-hidden="true"></div>
        <button id="bubble-0" class="bubble" type="button" aria-label="bubble"></button>
        <button id="bubble-1" class="bubble" type="button" aria-label="bubble" hidden></button>
        <button id="bubble-2" class="bubble" type="button" aria-label="bubble" hidden></button>
        <button id="bubble-3" class="bubble" type="button" aria-label="bubble" hidden></button>
        <button id="bubble-4" class="bubble" type="button" aria-label="bubble" hidden></button>
        <div id="gameover" role="alertdialog" aria-labelledby="gameover-title" hidden>
          <p id="gameover-title">Game Over</p>
          <p id="gameover-score"></p>
          <button id="new-game" type="button">New Game</button>
        </div>
      </div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
